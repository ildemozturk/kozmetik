<header class="navbar-custom py-3 border-bottom shadow-sm bg-white sticky-top">
  <div class="container d-flex justify-content-between align-items-center">
    
    <!-- Marka Logosu -->
    <a class="navbar-brand text-center m-0 cursor-pointer text-decoration-none" 
       routerLink="/" 
       routerLinkActive="active-brand" 
       [routerLinkActiveOptions]="{ exact: true }">
      <h1 class="brand-title m-0 fw-light" style="color: #c9667e !important; letter-spacing: 2px; font-weight: 400 !important;">LUMIÈRE</h1>
      <span class="brand-subtitle text-uppercase small text-muted" style="letter-spacing: 1.5px; font-size: 0.72rem;">Cosmetics</span>
    </a>

    <!-- Orta Menü -->
    <nav class="d-none d-md-flex align-items-center gap-4">
      <a routerLink="/urunler" routerLinkActive="active-nav-link" class="text-decoration-none text-muted fw-medium nav-link-custom">Ürünler</a>
      <a routerLink="/hakkimizda" routerLinkActive="active-nav-link" class="text-decoration-none text-muted fw-medium nav-link-custom">Hakkımızda</a>
      <a routerLink="/sss" routerLinkActive="active-nav-link" class="text-decoration-none text-muted fw-medium nav-link-custom">S.S.S.</a>
      <a routerLink="/iletisim" routerLinkActive="active-nav-link" class="text-decoration-none text-muted fw-medium nav-link-custom">İletişim</a>

    </nav>

    <!-- Sağ Taraf: Profil, Favoriler, Sepet -->
    <div class="d-flex align-items-center gap-4 text-muted fs-5 position-relative">

      <!-- HESABIM / PROFİL ALANI -->
      <div class="position-relative">
        <button type="button" 
                class="btn p-0 border-0 text-muted icon-btn d-flex align-items-center gap-2" 
                (click)="onProfileClick()" 
                title="Hesabım">
          <i class="bi bi-person fs-4" [class.text-pink]="isLoggedIn"></i>
          @if (isLoggedIn && currentUser) {
            <span class="user-greeting d-none d-lg-inline">{{ currentUser.fullName.split(' ')[0] }}</span>
          }
        </button>

        <!-- Açılır Kullanıcı Menüsü -->
        @if (isUserMenuOpen && isLoggedIn) {
          <div class="user-dropdown-menu shadow-lg bg-white border rounded-3 p-2 position-absolute end-0 mt-2">
            <div class="px-3 py-2 border-bottom">
              <span class="text-muted" style="font-size: 0.75rem;">{{ isAdmin ? 'Yönetici Girişi' : 'Giriş Yapıldı' }}</span>
              <p class="mb-0 fw-bold text-dark text-truncate" style="font-size: 0.95rem;">{{ currentUser?.fullName }}</p>
            </div>

            <div class="py-1">
              <!-- Siparişlerim: Sadece normal kullanıcıda gözükür, adminde gizlidir -->
              @if (!isAdmin) {
                <button type="button" (click)="openOrdersModal()" class="dropdown-item py-2 px-3 small text-dark d-flex align-items-center gap-2 border-0 bg-transparent w-100 text-start">
                  <i class="bi bi-bag-check text-pink"></i> Siparişlerim
                </button>
              }

              <!-- Admin için Stok Yönetimi / Yönetim Paneli Linki -->
              @if (isAdmin) {
                <a routerLink="/admin/dashboard" (click)="isUserMenuOpen = false" class="dropdown-item py-2 px-3 small text-dark d-flex align-items-center gap-2">
                  <i class="bi bi-boxes text-pink"></i> Stok Yönetimi
                </a>
              }
            </div>

            <div class="border-top pt-1 mt-1">
              <button type="button" (click)="logout()" class="dropdown-item py-2 px-3 small text-danger d-flex align-items-center gap-2 border-0 bg-transparent w-100 text-start">
                <i class="bi bi-box-arrow-right"></i> Çıkış Yap
              </button>
            </div>
          </div>
        }
      </div>

      <!-- FAVORİLER -->
      <button type="button" class="btn p-0 border-0 text-muted icon-btn position-relative" (click)="toggleWishlistModal()" title="Favorilerim">
        <i class="bi bi-heart fs-5"></i>
        @if (wishlistCount > 0) {
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-pink" style="font-size: 0.55rem;">
            {{ wishlistCount }}
          </span>
        }
      </button>

      <!-- SEPET -->
      <a routerLink="/cart" routerLinkActive="active-icon-link" class="btn p-0 border-0 text-muted icon-btn position-relative text-decoration-none" title="Sepetim">
        <i class="bi bi-bag fs-5"></i>
        @if (cartCount > 0) {
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-pink" style="font-size: 0.55rem;">
            {{ cartCount }}
          </span>
        }
      </a>

    </div>

  </div>
</header>
